# =============================================================================
# CSU Advisory Alert - TEST CONFIGURATION
# =============================================================================
# This config is used by run_test.bat only.
# Emails go to the TEST inbox only - safe to run anytime without spamming clients.
# Points to test_advisory.xlsx (generated by generate_test_data.py from real tracker).
# =============================================================================

[excel]
# Points to test data only - never the real production tracker
workbook_file     = test_advisory.xlsx
workbook_fallback = dummy_advisory.xlsx
sheet_name        = Advisory

[email]
# TEST INBOX ONLY - change this to your own email address for testing
to               = tejesh988@outlook.com
cc               =
sent_on_behalf   =

[behavior]
# false = opens email preview in Outlook for visual check before any send
auto_send            = false
max_alerts_per_cycle = 5
seed_all_existing    = false

[refresh]
# Disable macro refresh during testing - no SharePoint needed
enable_auto_refresh       = false
auto_refresh_wait_seconds = 0

[columns]
title             = 1
advisory_type     = 2
advisory_no       = 4
date              = 5
summary           = 7
attack_vector     = 8
impact_analysis   = 9
iocs              = 10
recommendation    = 11
reference         = 12
cve               = 13
impacted_elements = 14
attack_type       = 15
severity          = 18

[paths]
output_dir           = output_test
tracking_file_prefix = .test_processed_ids