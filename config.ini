# =============================================================================
# CSU Threat Intelligence - Advisory Alert Automation Configuration
# =============================================================================
# Edit this file to configure the system. Do NOT touch advisory_alert_runner.py
# for routine changes - all user settings live here.
#
# SECTIONS:
#   [excel]    - Source workbook and sheet settings
#   [email]    - Recipient addresses and sender identity
#   [behavior] - Send mode, batch limits, seeding
#   [refresh]  - Excel macro auto-refresh settings
#   [columns]  - Column positions in the Advisory sheet (1-based index)
#   [paths]    - Output folder and tracking file prefix
# =============================================================================


# -----------------------------------------------------------------------------
# [excel] - Source workbook settings
# -----------------------------------------------------------------------------
[excel]

# Primary tracker file. If Advisory_Tracker.xlsm exists it takes priority.
workbook_file     = Advisory_Tracker.xlsm
workbook_fallback = dummy_advisory.xlsx

# Name of the sheet tab inside the workbook that holds advisory data
sheet_name        = Advisory


# -----------------------------------------------------------------------------
# [email] - Who receives the alerts
# -----------------------------------------------------------------------------
[email]

# Primary recipient (To field)
to               = nagireddy-gari.shinysreeja@capgemini.com

# Carbon copy recipient(s). Separate multiple addresses with a comma.
cc               = tejesh988@outlook.com

# Optional: Shared mailbox or sender name to send on behalf of.
# Leave blank to use the default logged-in Outlook profile.
sent_on_behalf   =


# -----------------------------------------------------------------------------
# [behavior] - Send mode and processing controls
# -----------------------------------------------------------------------------
[behavior]

# auto_send = true  -> Sends emails immediately and silently in the background.
# auto_send = false -> Opens each email on screen in Outlook for manual review.
auto_send            = true

# Maximum alerts to process per run (0 = no limit, process ALL new alerts found).
max_alerts_per_cycle = 0

# ONE-TIME BASELINE SEEDING:
# Set to true only when deploying on a sheet that already has old historical
# alerts you do NOT want to re-send. Set back to false after the first seed run.
seed_all_existing    = false


# -----------------------------------------------------------------------------
# [refresh] - Excel macro auto-refresh (SharePoint / Power Query)
# -----------------------------------------------------------------------------
[refresh]

# Enable macro RefreshAll before reading the sheet (pulls latest SharePoint data).
enable_auto_refresh       = true

# Seconds to wait after triggering RefreshAll before reading the sheet.
auto_refresh_wait_seconds = 20


# -----------------------------------------------------------------------------
# [columns] - Advisory sheet column positions (1-based index)
# Change ONLY if columns in the tracker spreadsheet are rearranged.
# -----------------------------------------------------------------------------
[columns]

title             = 1
advisory_type     = 2
advisory_no       = 4
date              = 5
summary           = 7
attack_vector     = 8
impact_analysis   = 9
iocs              = 10
recommendation    = 11
reference         = 12
cve               = 13
impacted_elements = 14
attack_type       = 15
severity          = 18


# -----------------------------------------------------------------------------
# [paths] - Output directories and file naming
# -----------------------------------------------------------------------------
[paths]

# Folder where generated .msg / .eml advisory packages are saved
output_dir           = output_msg

# Prefix for date-scoped deduplication tracking files.
# Files created: .processed_ids_YYYY-MM-DD.txt  (one per Advisory Preparation Date batch)
tracking_file_prefix = .processed_ids