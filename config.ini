# =============================================================================
# CSU Threat Intelligence - Advisory Alert Automation Configuration
# =============================================================================
# INSTRUCTIONS:
# - FOR TESTING: Set workbook_file to dummy_advisory.xlsx, auto_send = false, and set 'to' to your email.
# - FOR PROD:    Set workbook_file to Advisory_Tracker.xlsm, auto_send = true, and set 'to' to client email.
# =============================================================================

[excel]
# 1. Excel File to read:
#    - For Testing: dummy_advisory.xlsx (or copy 10-50 sample rows here)
#    - For Prod:    Advisory_Tracker.xlsm
workbook_file     = Advisory_Tracker.xlsm
workbook_fallback = dummy_advisory.xlsx

# Sheet tab name inside Excel containing the advisory data
sheet_name        = Advisory


[email]
# 2. Email Recipients:
#    - For Testing: Put YOUR email address (e.g. yourname@capgemini.com)
#    - For Prod:    Put Client / Team email address
to               = nagireddy-gari.shinysreeja@capgemini.com
cc               = tejesh988@outlook.com

# Optional: Shared mailbox address to send on behalf of (leave blank for default)
sent_on_behalf   =


[behavior]
# 3. Email Sending Behavior:
#    - auto_send = false  --> (TEST MODE) Opens email drafts in Outlook for review before sending.
#    - auto_send = true   --> (PROD MODE) Sends emails automatically in the background.
auto_send            = true

# Max alerts to process per run (0 = unlimited / process all new alerts found)
max_alerts_per_cycle = 0

# Baseline Seeding:
# Set to true ONLY if you want to mark all existing alerts as seen without sending emails.
seed_all_existing    = false


[refresh]
# 4. SharePoint / PowerQuery Auto-Refresh:
#    - enable_auto_refresh = true   --> Refreshes Excel macro/data connections before reading
#    - enable_auto_refresh = false  --> Skip refresh (recommended for offline/testing)
enable_auto_refresh       = true
auto_refresh_wait_seconds = 20


[columns]
# 5. Column Positions in the Advisory Excel Sheet (1-based index: A=1, B=2, etc.)
title             = 1
advisory_type     = 2
advisory_no       = 4
date              = 5
summary           = 7
attack_vector     = 8
impact_analysis   = 9
iocs              = 10
recommendation    = 11
reference         = 12
cve               = 13
impacted_elements = 14
attack_type       = 15
severity          = 18


[paths]
# 6. Output & Tracking Folders (Kept organized in folders):
# - Generated email packages (.msg / .eml / .html)
output_dir           = output_msg

# - Processed ID tracking files are saved in 'tracking/' folder
tracking_file_prefix = tracking/.processed_ids